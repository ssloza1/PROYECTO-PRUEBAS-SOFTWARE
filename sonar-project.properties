# Identificación del proyecto en SonarQube
sonar.projectKey=SistemaVentas
sonar.projectName=Sistema de Ventas - Verificacion y Validacion
sonar.projectVersion=1.0.0

# Credenciales de acceso (usar la variable de entorno SONAR_TOKEN)

# Rutas del código y pruebas
sonar.sources=src,public
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.js, tests/**/*.spec.js

# Exclusiones
sonar.exclusions=node_modules/**, coverage/**

# Formato de texto y reporte de cobertura de Jest
sonar.sourceEncoding=UTF-8
sonar.javascript.lcov.reportPaths=coverage/lcov.info